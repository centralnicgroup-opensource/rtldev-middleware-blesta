# pnpm settings live here, not in the `pnpm` field of package.json. pnpm 10 stopped
# reading that field; it kept warning rather than failing, so the override below quietly
# stopped applying while the lockfile still recorded it. A frozen install then refused the
# mismatch, which is what blocked every release after v5.0.1.
overrides:
  # gulp-composer pulls shelljs, and versions below 0.8.5 carry CVE-2022-0144
  # (GHSA-4rq4-32rv-6wp6), improper privilege management. Nothing here depends on shelljs
  # directly, so without this pin the resolved version is whatever the transitive range
  # happens to allow.
  shelljs: ^0.8.5

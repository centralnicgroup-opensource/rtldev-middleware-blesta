# Drives the on-attach banner the devbase Feature prints. Sourced as shell, so
# quote values containing spaces. Every setting is optional; see
# https://github.com/centralnicgroup-opensource/rtldev-middleware-devcontainer-features

TITLE="BLESTA - development environment"

SHOW_PHP=true
SHOW_NODE=auto

PHP_EXTENSIONS="apcu curl gd mbstring mysql xdebug xml zip"

COMPOSER_DEPS="centralnic-reseller/php-sdk"
NODE_DEPS="gulp"

EXTRA_ROWS="Apache|apache2 -v|3
MySQL|mysql --version|"
